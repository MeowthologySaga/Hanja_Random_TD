name: Verify game

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # 시뮬 135판이 워커 2개에서 3분 남짓 걸린다(실측). 나머지 단계와 합쳐도
    # 여유가 있도록 25분으로 둔다.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:data
      - run: npm test
      # 15판으로 돌리던 것을 135판으로 올렸다.
      #
      # 게이트에는 「승률 45~60%」와 「지역 격차 ≤ 15%p」가 들어 있는데, 15판은
      # 지역당 5판이라 그 값들이 표본 잡음에 통째로 묻힌다 — 실제로 CI 가 두 번
      # 연속 지역 격차 0.2 로 떨어져 빨간불이 굳어 있었다(같은 코드가 135판에서는
      # 0.111 로 통과한다). 게이트를 느슨하게 푸는 대신 표본을 게이트에 맞춘다.
      # 135판은 프로젝트가 정본으로 삼는 표준 모드 판수이기도 하다.
      - run: npm run simulate -- --runs=135
      - run: npm run build
